name: Docs CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".env.example"
      - "docker-compose.yml"
      - "docs/**"
      - "scripts/check_docs_config.py"
      - ".github/workflows/docs-ci.yml"

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-config:
    name: Documentation And Configuration Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Verify required docs, placeholders, and env example
        run: python scripts/check_docs_config.py

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
