name: Security CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret And Environment File Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject committed non-example env files
        run: |
          set -euo pipefail
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env($|\.|/)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "${tracked_env_files}" ]; then
            echo "Committed .env files are not allowed:"
            echo "${tracked_env_files}"
            exit 1
          fi

  backend-dependencies:
    name: Backend Dependency Vulnerability Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend production dependencies
        run: |
          python -m pip install .
          python -m pip freeze --exclude-editable > /tmp/backend-requirements.txt

      - name: Install pip-audit
        run: |
          python -m pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r /tmp/backend-requirements.txt

  mobile-dependencies:
    name: Mobile Dependency Vulnerability Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
