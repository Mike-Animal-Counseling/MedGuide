[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medguide-backend"
version = "0.1.0"
description = "MedGuide AI backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "email-validator>=2.2,<3",
  "httpx>=0.27,<1",
  "Pillow>=11,<13",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "redis>=5,<7",
  "sentry-sdk[fastapi]>=2,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "tzdata>=2026.1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "pytest-asyncio>=0.24,<1",
  "ruff==0.15.15",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["app/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/**/*.py" = ["I001"]
"app/tests/**/*.py" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
